name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-26

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.6.app

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      - name: Build and test
        run: |
          set -euo pipefail
          xcodebuild \
            -project Spotlightify.xcodeproj \
            -scheme Spotlightify \
            -destination 'platform=macOS' \
            -derivedDataPath .build/DerivedData \
            CODE_SIGN_IDENTITY=- \
            test
